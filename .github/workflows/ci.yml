name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -count=1 -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          CGO_ENABLED: '1'

      - name: Per-package coverage
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          FAIL=0
          for pkg in dane noiseproto spkipin truststrap; do
            go test -count=1 -race -coverprofile="coverage-${pkg}.out" -covermode=atomic "./pkg/${pkg}/..."
            COV=$(go tool cover -func="coverage-${pkg}.out" | grep total | awk '{print $3}' | tr -d '%')
            if [ -z "$COV" ]; then COV="0.0"; fi
            INT=$(echo "$COV" | cut -d. -f1)
            if [ "$INT" -lt 90 ]; then
              echo "| pkg/${pkg} | ${COV}% | :x: FAIL |" >> $GITHUB_STEP_SUMMARY
              FAIL=1
            else
              echo "| pkg/${pkg} | ${COV}% | :white_check_mark: PASS |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: ${TOTAL}**" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Coverage threshold (90%) not met for one or more packages"
            exit 1
          fi

      - name: Build CLI
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/truststrap ./cmd/truststrap

      - name: Verify binary
        run: ./bin/truststrap version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: gosec
        run: >-
          gosec -exclude=G104,G115,G304,G402
          -severity medium -confidence medium
          -exclude-dir=test -exclude-dir=testdata -exclude-dir=vendor
          -exclude-generated
          ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify module integrity
        run: go mod verify

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Blocking, per devops.md §8. govulncheck is also the §9 forcing function
      # for toolchain currency, so a warning here would defeat its purpose.
      - name: govulncheck
        run: govulncheck -show verbose ./...

  # devops.md §8: trivy fs gates dependency CVEs, leaked secrets and
  # misconfigurations in the tree on CRITICAL/HIGH, on both hosts.
  #
  # trivy-action downloads its setup from github.com and cannot authenticate
  # from a Gitea runner, and code-scanning SARIF upload is a GitHub-only
  # mechanic — both are guarded on github.server_url. The Gitea leg installs
  # the trivy CLI from the release tarball and runs the same gate, so neither
  # host is left unscanned.
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Install trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          TRIVY_VERSION=$(curl -fsSL https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 .
