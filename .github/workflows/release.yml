name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Nothing publishes until the tag (without its v prefix), the VERSION file and the CHANGELOG agree.
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tag matches VERSION and CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"

          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v${TAG} does not match VERSION file (${FILE})."
            echo "Bump VERSION in the release commit before tagging."
            exit 1
          fi

          if ! grep -qF "## [${TAG}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG}]' heading."
            echo "Every released tag gets its own section; do not tag from [Unreleased]."
            exit 1
          fi

          echo "tag v${TAG} matches VERSION and has a CHANGELOG section"

  release:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="truststrap-${os}-${arch}"
              if [ "$os" = "windows" ]; then
                name="${name}.exe"
              fi
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/${name}" ./cmd/truststrap
            done
          done

      - name: Generate checksums
        run: |
          cd dist
          # `--` ends option parsing so a dash-prefixed artifact name is hashed, not read as a flag.
          sha256sum -- * > SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Publishes through the forge's /api/v1 releases API with internal/gitearelease and AGENT_TOKEN.
      - name: Create Gitea Release
        if: github.server_url != 'https://github.com'
        env:
          RELEASE_TOKEN: ${{ secrets.AGENT_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: go run ./internal/cmd/gitea-release

  docker:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io on GitHub; otherwise the forge's own registry, derived from the server URL.
      - name: Resolve registry
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "host=ghcr.io" >> "$GITHUB_OUTPUT"
          else
            echo "host=$(echo '${{ github.server_url }}' | sed -E 's#^https?://##')" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Stage the module credential as a BuildKit secret file outside the build context; empty on github.com, where the mount is optional.
      - name: Stage module-fetch credentials
        id: gomodauth
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.secret"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            # Write only the tokenised insteadOf key, raw with no trailing newline, never as shell.
            printf '%s' "${GIT_CONFIG_KEY_0}" > "${RUNNER_TEMP}/gomodauth.secret"
            echo "staged Gitea module credential"
          else
            echo "no Gitea credentials in this environment; resolving from the public proxy"
          fi
          echo "path=${RUNNER_TEMP}/gomodauth.secret" >> "$GITHUB_OUTPUT"

      # Scan the amd64 image for CRITICAL/HIGH before publishing the multi-arch manifest.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: go-truststrap:scan
          build-args: |
            VERSION=${{ github.ref_name }}
          secret-files: |
            gomodauth=${{ steps.gomodauth.outputs.path }}
          cache-from: type=gha

      # Install the trivy CLI the same way ci.yml does.
      - name: Install trivy CLI
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy image gate (fail on CRITICAL/HIGH)
        # --ignore-unfixed on the OS layer: the gate fails only on what a rebuild fixes.
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 go-truststrap:scan

      # Everything above is a hard gate on every forge and needs no registry.

      # Publication is GitHub-only: forge agent tokens carry no package scope.
      - name: Log in to the container registry
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: github.server_url == 'https://github.com'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          secret-files: |
            gomodauth=${{ steps.gomodauth.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Staged credentials do not outlive the job that needed them, however it
      # ended.
      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.secret"

      # A skipped step is easy to miss in a run summary, and a release that
      # quietly ships no image is exactly the state #12 was filed about. Say so
      # in the summary either way, so nobody has to infer it from a green run.
      - name: Report image publication
        if: always()
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "::notice::published ${{ steps.registry.outputs.host }}/${{ github.repository }}:${{ github.ref_name }}"
          else
            echo "::warning::image NOT published (push=${{ steps.push.outcome }}): no Gitea credential carries registry package scope (automatethethings#5). The image was still built and passed the Trivy CRITICAL/HIGH gate; the binaries and the Release object are unaffected."
          fi
