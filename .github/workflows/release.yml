name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Nothing publishes until the tag, the VERSION file and the CHANGELOG agree.
  #
  # This exists because they silently diverged: VERSION read 0.1.2-alpha while
  # v0.1.3-alpha and v0.1.4-alpha were both released, so binaries built from
  # either tag reported 0.1.2-alpha through -X main.version -- two different
  # releases identifying themselves as the same version, with nothing in CI
  # noticing. conventions/release-versioning.md §2 names this as the known gap
  # ("two sources of truth, and nothing reconciles them"); this job closes it
  # for this repo.
  #
  # The tag is v-prefixed and VERSION is not. That asymmetry is portfolio-wide
  # and deliberate, so the check strips the prefix rather than demanding they
  # be spelled identically.
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tag matches VERSION and CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"

          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v${TAG} does not match VERSION file (${FILE})."
            echo "Bump VERSION in the release commit before tagging."
            exit 1
          fi

          if ! grep -qF "## [${TAG}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG}]' heading."
            echo "Every released tag gets its own section; do not tag from [Unreleased]."
            exit 1
          fi

          echo "tag v${TAG} matches VERSION and has a CHANGELOG section"

  release:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="truststrap-${os}-${arch}"
              if [ "$os" = "windows" ]; then
                name="${name}.exe"
              fi
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/${name}" ./cmd/truststrap
            done
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io on GitHub, Gitea's own registry (same host and port as its web
      # UI) on the internal network — derived, never hardcoded (devops.md §2).
      # ghcr.io does not exist on the internal network, so a release built there
      # had nowhere to push (lessons.md).
      - name: Resolve registry
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "host=ghcr.io" >> $GITHUB_OUTPUT
          else
            echo "host=$(echo '${{ github.server_url }}' | sed -E 's#^https?://##')" >> $GITHUB_OUTPUT
          fi

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # devops.md §8: every container image is gated on CRITICAL/HIGH *before*
      # it reaches a registry. Build the amd64 leg locally, scan it, then
      # publish the multi-arch manifest from the same layer cache.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: go-truststrap:scan
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha

      # The trivy CLI works identically on both hosts; trivy-action's setup
      # cannot authenticate to github.com from a Gitea runner.
      - name: Install trivy CLI
        run: |
          TRIVY_VERSION=$(curl -fsSL https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy image gate (fail on CRITICAL/HIGH)
        # --ignore-unfixed on the OS layer, ratified 2026-08-14 (devops.md §8):
        # base images carry hundreds of unfixable advisories at any moment, so a
        # raw gate would be permanently red and would train people to ignore it.
        # This gate means "a rebuild fixes this" — actionable, so enforceable.
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 go-truststrap:scan

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
