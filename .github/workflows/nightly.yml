# Nightly and on-demand jobs outside the merge gate: the strict FIPS test and the Trivy scans.
# .trivyignore and .trivy-version must exist at the repository root; `make install-trivy` installs the pinned scanner.

name: Nightly

permissions:
  contents: read
  # upload-sarif needs this; without it the upload fails under read-only
  # default token permissions on the GitHub mirror (nightly-template v1.3).
  security-events: write

env:
  # Keep in step with ci.yml's GO_VERSION; the fips job's setup-go reads it.
  GO_VERSION: '1.27.3'

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      # fips140=only makes non-approved algorithms fail; do not relax it to `on`.
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # -tags fips swaps the X25519 helpers in pkg/noiseproto for ErrFIPSUnsupported stubs; docs/fips.md records the exemption.
      - name: Build all packages (FIPS mode)
        run: go build -tags fips ./...

      # The lint and security jobs in ci.yml run untagged and so never see the
      # fips-tagged files. Vetting them here keeps them under static analysis.
      - name: Vet (FIPS mode)
        run: go vet -tags fips ./...

      # Same as `make test-fips`: -tags fips, no -race; X25519-only tests live in *_nofips_test.go files.
      - name: Unit tests (FIPS mode)
        run: go test -tags fips -count=1 -timeout=900s ./...


  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ONE declaration of the trivy version, shared by both paths below and by
      # the Makefile, so the scanner in CI and the scanner on a developer's
      # machine are the same build. Bump .trivy-version, nothing else.
      - name: Resolve pinned trivy version
        id: trivy_version
        run: echo "version=$(tr -d ' \t\n\r' < .trivy-version)" >> "$GITHUB_OUTPUT"

      # Skip test/ only. trivy-action is pinned to a commit SHA; when bumping, take the peeled `<tag>^{}` sha from `git ls-remote --tags`.
      - name: Trivy scan (SARIF for code scanning)
        # trivy-action's setup needs a github.com token.
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test
          trivyignores: .trivyignore

      # Same gate on other forges, with trivy installed by the pinned, checksum-verified `make install-trivy`.
      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: make install-trivy TRIVY_INSTALL_DIR=/usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test --ignorefile .trivyignore .

      # Advisory misconfiguration scan on every forge; findings do not block merges.
      - name: Trivy misconfiguration scan (advisory, GitHub)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          exit-code: 0
          format: table
          skip-dirs: test
          trivyignores: .trivyignore

      - name: Trivy misconfiguration scan (advisory, Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners misconfig --exit-code 0 --format table --skip-dirs test --ignorefile .trivyignore .

