# claude-review: v1.2 — DISABLED at the trigger (owner ruling 2026-08-24:
# Codex is the sole designated peer reviewer; codex-review.yml reviews every
# PR). This workflow is kept, not deleted, so it can be re-enabled by restoring
# the `pull_request` trigger if Claude peer review is ever wanted again.
#
# THE TRIGGER-LEVEL DISABLE IS LOAD-BEARING FOR THE MERGE GATE, not just for
# lint. A job disabled with a false condition still REGISTERS its commit-status
# context, and Gitea writes a terminal `skipped` status and a `pending` status
# for it in the same second — which one a consumer resolves as latest is a
# race (measured on go-truststrap PRs #31/#34/#37, 2026-08-30/31: the two
# status API endpoints disagreed about the same commit). The QuicBaaS SDLC
# merge gate ingests one PipelineRun per context, fail-closed, so a `pending`
# winner strands every autonomous merge until an operator republishes the
# context by hand. Only a trigger with no `pull_request` event never registers
# the context at all. DO NOT move the disable back onto the job as a condition
# — even a non-constant expression that satisfies actionlint reintroduces the
# stranding (v1.2, go-truststrap#32 / automatethethings#13).
#
# Secondary reason, same conclusion: actionlint rejects a constant expression
# in a job condition ("constant expression in condition [if-cond]") and fails
# the workflow-lint step in any repo that lints workflows (measured: go-netmon
# run 6512, go-sysmon run 6520, 2026-08-25).
#
# `runs-on: claude` is restricted: only this workflow may use it — the label
# mounts the live Claude session credential. Gitea-only. Source of truth:
# software/templates/github-actions/ in the company repo.
name: Claude Review

on:
  # Disabled 2026-09-06 (owner ruling): gpu-host is the only review host and
  # the `claude` lane is stopped, so a pull_request trigger would queue a job
  # with no runner. Manual dispatch only.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

jobs:
  review:
    name: Claude Review
    # Guard the credential-mounting job off github.com regardless of trigger.
    if: github.server_url != 'https://github.com'
    runs-on: claude
    timeout-minutes: 40
    env:
      REPO: ${{ github.event.repository.name }}
      # Dispatch-only trigger: the PR number comes from the required input, not
      # a pull_request event payload (absent under workflow_dispatch).
      PR_NUM: ${{ inputs.pr_number }}
      GITEA_CLAUDE_TOKEN: ${{ secrets.CLAUDE_BOT_TOKEN }}
    steps:
      - name: Run Claude review
        run: /opt/claude-worker/claude-review.sh
