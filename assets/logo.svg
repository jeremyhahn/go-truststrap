<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Trusted CA project logo</title>
  <desc id="desc">A stylized logo for Trusted CA combining a trust ring, certificate seal, and root anchor motif.</desc>
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2e27"/>
      <stop offset="55%" stop-color="#10685c"/>
      <stop offset="100%" stop-color="#0a211c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9fff7"/>
      <stop offset="100%" stop-color="#9ff2e1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8fff6"/>
      <stop offset="100%" stop-color="#7be6d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="912" height="272" rx="36" fill="#f3fcf9"/>

  <g filter="url(#shadow)">
    <rect x="48" y="48" width="224" height="224" rx="52" fill="url(#panel)"/>

    <path d="M160 94
             a66 66 0 1 1 -0.01 0"
          fill="none"
          stroke="url(#ring)"
          stroke-width="15"
          stroke-linecap="round"
          stroke-dasharray="326 52"/>

    <circle cx="160" cy="94" r="10" fill="#d8fff6"/>
    <circle cx="225" cy="206" r="10" fill="#d8fff6"/>
    <circle cx="95" cy="206" r="10" fill="#d8fff6"/>

    <path d="M196 186
             q18 10 28 28"
          fill="none"
          stroke="url(#ring)"
          stroke-width="11"
          stroke-linecap="round"/>

    <g>
      <circle cx="160" cy="150" r="34" fill="url(#seal)"/>
      <path d="M145 176
               l-12 22
               l18 -8
               l9 16
               l9 -16
               l18 8
               l-12 -22"
            fill="url(#ribbon)"
            opacity="0.95"/>
      <path d="M145 151
               l9 9
               l21 -22"
            fill="none"
            stroke="#047857"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <circle cx="160" cy="150" r="24" fill="none" stroke="#4cd3bb" stroke-opacity="0.45" stroke-width="4"/>
    </g>
  </g>

  <g transform="translate(314 86)">
    <text x="0" y="72" fill="#0d2e27" font-size="74" font-weight="700" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" letter-spacing="1">Trusted CA</text>
    <text x="2" y="118" fill="#0c7b67" font-size="26" font-weight="600" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" letter-spacing="3">PRIVATE PKI WITH STRONG DEVICE IDENTITY</text>
    <path d="M2 148 h460" stroke="#d7eee8" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="190" fill="#4e7067" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif">
      <tspan>ACME</tspan>
      <tspan dx="18">•</tspan>
      <tspan dx="18">Hardware Attestation</tspan>
      <tspan dx="18">•</tspan>
      <tspan dx="18">Multi-tenant PKI</tspan>
    </text>
  </g>
</svg>
